name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than burning minutes on
# results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      # Note: `ruff format` is deliberately not enforced. app/analysis/lexicons.py
      # is a hand-formatted data table -- auto-formatting explodes each
      # (phrase, weight) tuple onto its own line and makes the sales lexicon
      # much harder to review. `ruff check` covers the rules that matter.

      - name: Type check
        working-directory: backend
        run: mypy app

      # A newly disclosed advisory in a pinned dependency should fail the build,
      # not sit unnoticed. The as-merged dependency set carried 14 known
      # vulnerabilities across 3 packages before this gate existed.
      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

      - name: Security static analysis
        working-directory: backend
        run: bandit -q -r app

      # The previous pipeline printed "Backend validation successful" and never
      # ran a single test. This actually runs them, and the build fails if
      # coverage of the analysis engine regresses.
      - name: Test
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=80

      # Benchmarks assert only loose ceilings and a scaling ratio, so they
      # catch an accidentally quadratic analyzer without failing because a
      # shared runner was busy. Output is printed for the record.
      - name: Benchmarks
        working-directory: backend
        run: pytest tests/test_benchmarks.py -s -q

      # Retrains the sentiment model on real data and re-runs the comparison
      # against the lexicon baseline. Non-blocking: it needs network access to
      # fetch SST-2, and a corpus mirror being down must not fail an unrelated
      # PR. The numbers appear in the job log.
      - name: Train and evaluate sentiment model
        continue-on-error: true
        working-directory: backend
        run: |
          pip install -r requirements-ml.txt
          python -m app.cli.main train

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: callsense_test
          POSTGRES_USER: callsense
          POSTGRES_PASSWORD: callsense
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-postgres.txt

      # SQLite covers local development; this runs the same integration suite
      # against the database production actually uses.
      #
      # TEST_DATABASE_URL was exported here long before anything read it, so
      # this job ran SQLite twice while claiming to prove Postgres worked. The
      # `settings` fixture honours it now, and TestDatabaseUnderTest asserts
      # the live engine really is speaking postgresql -- so a regression that
      # quietly reverts to SQLite fails the job instead of passing it.
      - name: Test against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://callsense:callsense@localhost:5432/callsense_test
        run: pytest tests/integration -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Blocking gate: the tree that actually ships. A vulnerability here
      # reaches the browser bundle or the Next server, so it fails the build.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Informational: the dev tree too. Not blocking, because some advisories
      # have no fixed version at all -- GHSA-vfj7-8cjw-p6xm covers *every*
      # release of `braces`, which reaches us only through
      # @next/eslint-plugin-next -> fast-glob -> micromatch. Blocking on an
      # unfixable advisory in a lint dependency trains people to ignore the
      # audit, which costs more than it protects. Still printed so a dev-tree
      # advisory that *is* fixable gets noticed.
      - name: Dependency audit (including dev)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # A build failure here is exactly the class of bug that shipped before:
      # components importing files that did not exist.
      - name: Build
        run: npm run build

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium
          npm install --no-save @axe-core/playwright playwright

      - name: Seed and boot
        run: |
          cd backend
          python -m app.cli.main import ../examples/transcripts
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ../frontend && npm run build && npx next start -p 3000 &
          for i in $(seq 1 60); do
            curl -sf localhost:3000 >/dev/null && \
            curl -sf localhost:8000/health/live >/dev/null && break
            sleep 2
          done

      # WCAG 2.1 A/AA via axe-core, across every view in both colour schemes.
      # Fails the build on any violation.
      - name: axe-core audit
        run: cd frontend && node scripts/a11y-audit.mjs

  end-to-end:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # Proves the documented quick-start actually works on a clean checkout:
      # no AWS account, no database server, no model download.
      - name: Import the example transcripts
        working-directory: backend
        run: python -m app.cli.main import ../examples/transcripts

      - name: Boot the API and exercise it
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health/ready >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health/ready | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -sf "localhost:8000/api/v1/calls?page_size=5" | grep -q '"lead_band"'
          curl -sf localhost:8000/api/v1/analytics/pipeline | grep -q 'band_breakdown'
          curl -sf localhost:8000/api/v1/export/calls.csv | head -1 | grep -q 'lead_score'

          # Analyse through HTTP, not just the CLI: the import above runs in a
          # separate process, so without this the server under test has never
          # executed the engine and the analysis metrics below prove nothing.
          curl -sf -X POST localhost:8000/api/v1/calls \
            -H 'Content-Type: application/json' \
            -d '{"title":"smoke","transcript":"Rep: Hi, can I ask how you handle pipelines today?\nProspect: It is a mess, we have budget approved and need this by March.\nRep: Shall we book a follow up on Tuesday?\nProspect: Yes, Tuesday works."}' \
            | tee /dev/stderr | grep -q '"lead_band"'

          # Declared metrics must render on a cold worker too, so assert both:
          # the name is always exposed, and a real analysis moved the counter.
          curl -sf localhost:8000/metrics | tee /tmp/metrics.txt | grep -q '# TYPE callsense_analyses_total counter'
          grep -q '^callsense_analyses_total{' /tmp/metrics.txt
          grep -q 'callsense_conversation_dynamics_total' /tmp/metrics.txt
