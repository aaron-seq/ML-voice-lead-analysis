[pytest]
# Note: the section must be [pytest] in pytest.ini. The previous file used
# [tool:pytest], which is only valid in setup.cfg, so the entire configuration
# -- including the coverage gate -- was silently ignored.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    slow: tests that take more than a second
