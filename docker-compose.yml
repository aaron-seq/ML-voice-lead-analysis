# Local and small-deployment stack: API, dashboard, PostgreSQL.
#
# For a single team, SQLite is genuinely sufficient and needs no compose file
# at all -- see the quick start in README.md. This exists for when you want a
# real database and a reproducible environment.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callsense
      POSTGRES_USER: callsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callsense}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsense"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql+asyncpg://callsense:${POSTGRES_PASSWORD:-callsense}@db:5432/callsense
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/blobs
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: ${LOG_FORMAT:-console}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - blob-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time; the browser calls this
        # URL directly, so it must be reachable from the host, not from the
        # compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  blob-data:
